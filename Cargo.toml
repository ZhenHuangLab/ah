[package]
name = "ah"
version = "0.3.0"
edition = "2024"
description = "Read and share Claude Code, Codex and pi sessions in the terminal or a browser"
repository = "https://github.com/ZhenHuangLab/ah"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
jiff = "0.2.37"
notify = "8.2.0"
pulldown-cmark = "0.13.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
ratatui = "0.30.2"
rust-embed = { version = "8.12.0", features = ["mime-guess", "debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["compression-gzip"] }
unicode-linebreak = "0.1.5"
unicode-width = "0.2.2"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
