<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ah</title>
<link rel="icon" href="data:,">
<script>
  (function () {
    var root = document.documentElement;
    var t = localStorage.getItem('ah.theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    root.dataset.theme = t;
    var v = localStorage.getItem('ah.view');
    if (v === 'chat' || v === 'answers') root.classList.add('chat');
    if (v === 'answers') root.classList.add('answers');
    if (localStorage.getItem('ah.side') === '0') root.classList.add('side-closed');
    var w = +localStorage.getItem('ah.sideW');
    if (w) root.style.setProperty('--side-w', w + 'px');
  })();
</script>
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<script defer src="assets/vendor/katex/katex.min.js"></script>
<script defer src="assets/vendor/hljs/highlight.min.js"></script>
<script defer src="assets/app.js"></script>
</head>
<body>
<aside id="side">
  <div class="side-head">
    <input id="filter" type="search" placeholder="Filter sessions" autocomplete="off" spellcheck="false">
  </div>
  <div class="chips">
    <div id="agents">
      <button data-agent="" class="on">All</button><button data-agent="claude">Claude</button><button data-agent="codex">Codex</button><button data-agent="pi">pi</button>
    </div>
    <button id="group" title="Group the sessions by date or by folder">By date</button>
  </div>
  <nav id="list"></nav>
  <div id="grip" title="Drag to resize, double-click to reset"></div>
</aside>
<main id="main">
  <header id="top">
    <button id="menu" class="icon" title="Show or hide the sessions (s)">☰</button>
    <div class="heading">
      <h1 id="title">ah</h1>
      <div id="sub"></div>
    </div>
    <button id="view">All</button>
    <button id="cmds" class="icon" title="Commands and shortcuts (?)">⋯</button>
    <button id="theme" class="icon" title="Switch theme">◐</button>
  </header>
  <div id="scroll">
    <div id="conv"></div>
    <div id="empty">Pick a session on the left.</div>
  </div>
  <nav id="rail"><div id="ticks"></div></nav>
  <div id="card" hidden><div class="card-t"></div><div class="card-b"></div><div class="card-w"></div></div>
  <button id="bottom" class="icon" title="Jump to the latest message (G)" hidden>↓</button>
  <div id="toast" hidden></div>
</main>
<div id="palette" hidden>
  <div class="pal" role="dialog" aria-label="Commands">
    <input id="pal-q" type="text" placeholder="Search commands" autocomplete="off" spellcheck="false">
    <div id="pal-list" role="listbox"></div>
    <div class="pal-foot">↑↓ choose · enter run · esc close · open with ? or Ctrl K</div>
  </div>
</div>
</body>
</html>
