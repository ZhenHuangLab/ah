<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
<rect x="9" y="9" width="2" height="2" fill="#2a2a2f"/>
</pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#2df9c0" stop-opacity="0.13"/>
<stop offset="1" stop-color="#2df9c0" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
<feDropShadow dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
</filter>
<!-- A die-cut sticker: white paper 10px around the artwork, rounded, with a shadow under it.
     Growing by 18px and shrinking by 8px closes the gaps between loose pieces such as confetti. -->
<filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
<feMorphology in="SourceAlpha" operator="dilate" radius="18"/>
<feMorphology operator="erode" radius="8"/>
<feGaussianBlur stdDeviation="3"/>
<feComponentTransfer result="cut"><feFuncA type="linear" slope="8" intercept="-3.5"/></feComponentTransfer>
<feFlood flood-color="#fff"/>
<feComposite in2="cut" operator="in" result="paper"/>
<feDropShadow in="paper" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5" result="lifted"/>
<feMerge><feMergeNode in="lifted"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="browser-clip"><rect width="640" height="600" rx="12"/></clipPath>
<clipPath id="terminal-clip"><rect width="620" height="340" rx="12"/></clipPath>
<!-- The mark's outline, for cutting it out as a sticker -->
<path id="mark-cut" d="M2 0h20v1h1v1h1v18h-1v1h-1v1h-20v-1h-1v-1h-1v-18h1v-1h1z"/>
<path id="mark" d="M2 0h20v1h-20zM1 1h2v1h-2zM21 1h2v1h-2zM0 2h2v1h-2zM22 2h2v1h-2zM0 3h1v17h-1zM23 3h1v17h-1zM5 6h4v3h-4zM12 6h2v10h-2zM19 6h2v7h-2zM4 7h1v9h-1zM9 7h1v9h-1zM3 8h1v8h-1zM10 8h1v8h-1zM5 9h1v1h-1zM8 9h1v1h-1zM14 9h3v2h-3zM17 10h1v6h-1zM5 11h4v2h-4zM16 11h1v5h-1zM19 14h2v2h-2zM1 19h1v2h-1zM22 19h1v2h-1zM2 20h1v2h-1zM21 20h1v2h-1zM3 21h18v1h-18z"/>
</defs>

<rect width="1280" height="640" fill="#141416"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<circle cx="300" cy="300" r="320" fill="url(#glow)"/>

<!-- Slogan -->
<g transform="translate(200 188) rotate(-5)" filter="url(#sticker)">
<g transform="scale(8) translate(-12 -11)">
<use href="#mark-cut" fill="#1b1b1d"/>
<use href="#mark" fill="#2df9c0" shape-rendering="crispEdges"/>
</g>
</g>
<g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text font-size="52" font-weight="700" fill="#f4f4f5">
<tspan x="84" y="364"><tspan fill="#2df9c0">a</tspan>gent <tspan fill="#2df9c0">h</tspan>istory,</tspan>
<tspan x="84" y="426">anywhere.</tspan>
</text>
<rect x="366" y="386" width="29" height="48" fill="#2df9c0"/>
<text font-size="18" fill="#7c7c85">
<tspan x="88" y="480"># read what your coding agents did,</tspan>
<tspan x="88" y="506"># in a terminal or in any browser</tspan>
</text>
<text x="88" y="552" font-size="18" fill="#d4d4d8">github.com/ZhenHuangLab/ah</text>
</g>

<!-- Browser, as in `ah serve` -->
<g transform="translate(700 64)" filter="url(#shadow)">
<g clip-path="url(#browser-clip)" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="640" height="600" fill="#1b1b1d"/>
<rect width="640" height="40" fill="#28282c"/>
<circle cx="20" cy="20" r="6" fill="#ff5f57"/>
<circle cx="40" cy="20" r="6" fill="#febc2e"/>
<circle cx="60" cy="20" r="6" fill="#28c840"/>
<rect x="170" y="9" width="280" height="22" rx="11" fill="#1b1b1d"/>
