<rect x="52" y="54" width="134" height="26" rx="6" fill="none" stroke="#2f2f34"/>
<text x="62" y="71" font-size="11" fill="#7c7c85">Filter sessions</text>
<text x="18" y="108" font-size="11" font-weight="600" fill="#7c7c85">Today</text>
