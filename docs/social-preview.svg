<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<defs>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
<rect x="9" y="9" width="2" height="2" fill="#2a2a2f"/>
</pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#2df9c0" stop-opacity="0.13"/>
<stop offset="1" stop-color="#2df9c0" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
<feDropShadow dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
</filter>
<!-- A die-cut sticker: white paper 10px around the artwork, rounded, with a shadow under it.
     Growing by 18px and shrinking by 8px closes the gaps between loose pieces such as confetti. -->
<filter id="sticker" x="-25%" y="-25%" width="150%" height="150%">
<feMorphology in="SourceAlpha" operator="dilate" radius="18"/>
<feMorphology operator="erode" radius="8"/>
<feGaussianBlur stdDeviation="3"/>
<feComponentTransfer result="cut"><feFuncA type="linear" slope="8" intercept="-3.5"/></feComponentTransfer>
<feFlood flood-color="#fff"/>
<feComposite in2="cut" operator="in" result="paper"/>
<feDropShadow in="paper" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.5" result="lifted"/>
<feMerge><feMergeNode in="lifted"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="1.5"/>
</filter>
<clipPath id="browser-clip"><rect width="640" height="600" rx="12"/></clipPath>
<clipPath id="terminal-clip"><rect width="620" height="340" rx="12"/></clipPath>
<!-- The mark's outline, for cutting it out as a sticker -->
<path id="mark-cut" d="M2 0h20v1h1v1h1v18h-1v1h-1v1h-20v-1h-1v-1h-1v-18h1v-1h1z"/>
<path id="mark" d="M2 0h20v1h-20zM1 1h2v1h-2zM21 1h2v1h-2zM0 2h2v1h-2zM22 2h2v1h-2zM0 3h1v17h-1zM23 3h1v17h-1zM5 6h4v3h-4zM12 6h2v10h-2zM19 6h2v7h-2zM4 7h1v9h-1zM9 7h1v9h-1zM3 8h1v8h-1zM10 8h1v8h-1zM5 9h1v1h-1zM8 9h1v1h-1zM14 9h3v2h-3zM17 10h1v6h-1zM5 11h4v2h-4zM16 11h1v5h-1zM19 14h2v2h-2zM1 19h1v2h-1zM22 19h1v2h-1zM2 20h1v2h-1zM21 20h1v2h-1zM3 21h18v1h-18z"/>
</defs>

<rect width="1280" height="640" fill="#141416"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<circle cx="300" cy="300" r="320" fill="url(#glow)"/>

<!-- Slogan -->
<g transform="translate(200 188) rotate(-5)" filter="url(#sticker)">
<g transform="scale(8) translate(-12 -11)">
<use href="#mark-cut" fill="#1b1b1d"/>
<use href="#mark" fill="#2df9c0" shape-rendering="crispEdges"/>
</g>
</g>
<g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text font-size="52" font-weight="700" fill="#f4f4f5">
<tspan x="84" y="364"><tspan fill="#2df9c0">a</tspan>gent <tspan fill="#2df9c0">h</tspan>istory,</tspan>
<tspan x="84" y="426"><tspan fill="#2df9c0">a</tspan>nyw<tspan fill="#2df9c0">h</tspan>ere<tspan fill="#2df9c0">!</tspan></tspan>
</text>
<rect x="366" y="386" width="29" height="48" fill="#2df9c0"/>
<text font-size="18" fill="#7c7c85">
<tspan x="88" y="480"># read and share what your coding agents did,</tspan>
<tspan x="88" y="506"># in a terminal or in any browser</tspan>
</text>
<text x="88" y="552" font-size="18" fill="#d4d4d8">github.com/ZhenHuangLab/ah</text>
</g>

<!-- Browser, as in `ah serve` -->
<g transform="translate(700 64)" filter="url(#shadow)">
<g clip-path="url(#browser-clip)" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
<rect width="640" height="600" fill="#1b1b1d"/>
<rect width="200" height="600" fill="#151517"/>
<rect x="200" width="1" height="600" fill="#2f2f34"/>
<use href="#mark" fill="#2df9c0" shape-rendering="crispEdges" transform="translate(16 15) scale(1.1)"/>
<rect x="52" y="14" width="134" height="26" rx="6" fill="none" stroke="#2f2f34"/>
<text x="62" y="31" font-size="11" fill="#7c7c85">Filter sessions</text>
<text x="18" y="68" font-size="11" font-weight="600" fill="#7c7c85">Today</text>
<rect x="8" y="76" width="184" height="50" rx="8" fill="#2c3140"/>
<text x="18" y="96" font-size="12.5" fill="#e4e4e7">Importing statement.csv dro…</text>
<circle cx="22" cy="112" r="3" fill="#3fb950"/>
<text x="32" y="116" font-size="11" fill="#7c7c85">ledger · now</text>
<text x="18" y="152" font-size="12.5" fill="#e4e4e7">What is the expected numbe…</text>
<text x="18" y="170" font-size="11" fill="#7c7c85">notes · 2h</text>
<text x="18" y="202" font-size="12.5" fill="#e4e4e7">/search got slow after yest…</text>
<text x="18" y="220" font-size="11" fill="#7c7c85">api · 5h</text>
<rect x="200" y="60" width="440" height="1" fill="#2f2f34"/>
<text x="222" y="30" font-size="14" font-weight="600" fill="#e4e4e7">Importing statement.csv drops every row whose…</text>
<circle cx="226" cy="45" r="3" fill="#3fb950"/>
<text x="236" y="49" font-size="11" fill="#7c7c85">~/dev/ledger · claude-opus-5-5</text>
<rect x="330" y="76" width="290" height="52" rx="14" fill="#2a2a2e"/>
<text font-size="12.5" fill="#e4e4e7">
<tspan x="346" y="98">Does it also handle files exported from</tspan>
<tspan x="346" y="116">Excel on Windows?</tspan>
</text>
<text x="222" y="158" font-size="14" fill="#e4e4e7">I'll check both with a copy of an Excel export.</text>
<text x="222" y="186" font-size="12.5" fill="#a1a1aa">⌄  Ran 1 command, edited 2 files, 1 failed</text>
<rect x="228" y="196" width="1.5" height="72" fill="#2f2f34"/>
<g font-size="12">
<text x="242" y="214"><tspan fill="#7c7c85">›  </tspan><tspan font-weight="600" fill="#e4e4e7">Write</tspan><tspan font-family="'JetBrains Mono', monospace" fill="#a1a1aa">  tests/fixtures/excel.csv</tspan></text>
<text x="242" y="238"><tspan fill="#7c7c85">›  </tspan><tspan font-weight="600" fill="#e4e4e7">Edit</tspan><tspan font-family="'JetBrains Mono', monospace" fill="#a1a1aa">  tests/import.rs</tspan></text>
<text x="242" y="262"><tspan fill="#7c7c85">›  </tspan><tspan font-weight="600" fill="#f85149">Bash</tspan><tspan font-family="'JetBrains Mono', monospace" fill="#a1a1aa">  cargo test excel_export</tspan></text>
</g>
</g>
<rect x="0.5" y="0.5" width="639" height="599" rx="12" fill="none" stroke="#34343a"/>
</g>

<!-- Terminal, as in `ah` -->
<g transform="translate(624 340)" filter="url(#shadow)">
<g clip-path="url(#terminal-clip)" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
<rect width="620" height="340" fill="#1c1c1e"/>
<rect width="620" height="34" fill="#2a2a2d"/>
<circle cx="18" cy="17" r="6" fill="#ff5f57"/>
<circle cx="38" cy="17" r="6" fill="#febc2e"/>
<circle cx="58" cy="17" r="6" fill="#28c840"/>
<text x="310" y="22" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#8a8a8f" text-anchor="middle">ah</text>
<rect x="20" y="52" width="50" height="28" rx="5" fill="none" stroke="#2df9c0" stroke-width="1.5"/>
<text x="45" y="71" font-size="14" font-weight="700" fill="#2df9c0" text-anchor="middle">Ah!</text>
<text x="86" y="71" font-size="14" fill="#6c6c6c">12 of 12 sessions · * this directory</text>
<rect x="12" y="92" width="600" height="25" fill="#3a3a3a"/>
<g font-size="14">
<text y="110"><tspan x="18" fill="#949494">❯</tspan><tspan x="34" fill="#949494">*</tspan><tspan x="58" fill="#5faf5f">16s</tspan><tspan x="98" fill="#d7875f">claude</tspan><tspan x="162" fill="#949494">ledger</tspan><tspan x="232" fill="#eeeeee">Importing statement.csv drops every row…</tspan></text>
<text y="136"><tspan x="34" fill="#949494">*</tspan><tspan x="67" fill="#6c6c6c">1d</tspan><tspan x="98" fill="#d7875f">claude</tspan><tspan x="162" fill="#949494">ledger</tspan><tspan x="232" fill="#d0d0d0">Rename Config::load_from to Config::read…</tspan></text>
<text y="162"><tspan x="67" fill="#6c6c6c">2h</tspan><tspan x="98" fill="#af87ff">pi</tspan><tspan x="162" fill="#949494">notes</tspan><tspan x="232" fill="#d0d0d0">What is the expected number of fixed po…</tspan></text>
<text y="188"><tspan x="67" fill="#6c6c6c">5h</tspan><tspan x="98" fill="#5fd7af">codex</tspan><tspan x="162" fill="#949494">api</tspan><tspan x="232" fill="#d0d0d0">/search got slow after yesterday's depl…</tspan></text>
<text y="214"><tspan x="67" fill="#6c6c6c">3d</tspan><tspan x="98" fill="#af87ff">pi</tspan><tspan x="162" fill="#949494">notes</tspan><tspan x="232" fill="#d0d0d0">Derive the variance of the hypergeometr…</tspan></text>
<text y="240"><tspan x="67" fill="#6c6c6c">5d</tspan><tspan x="98" fill="#d7875f">claude</tspan><tspan x="162" fill="#949494">site</tspan><tspan x="232" fill="#d0d0d0">Set up a GitHub Actions workflow that b…</tspan></text>
<text y="266"><tspan x="58" fill="#6c6c6c">10d</tspan><tspan x="98" fill="#5fd7af">codex</tspan><tspan x="162" fill="#949494">site</tspan><tspan x="232" fill="#d0d0d0">Fix the broken links that lychee reports.</tspan></text>
</g>
</g>
<rect x="0.5" y="0.5" width="619" height="339" rx="12" fill="none" stroke="#3a3a3e"/>
</g>

<!-- Sticker: two Clawds, the Claude Code mascot. The body follows the Claude Code banner
     (" ▐▛███▜▌" / "▝▜█████▛▘" / "  ▘▘ ▝▝") at four units per block-character pixel across and
     eight down. On the left, ah's Clawd, a green phantom whose legs fade out, smiles and holds up
     a document. On the right, the original Clawd looks over at it, raises an arm and has an idea. -->
<g transform="translate(1046 486) rotate(6)" filter="url(#sticker)">
<g transform="scale(3.6) translate(-31.5 0.5)" shape-rendering="crispEdges">
<g transform="translate(0 -2)">
